# Tercera semilla de la v6 (semilla 2), en GitHub Actions, para cumplir "3 semillas de entrenamiento para los
# finalistas": la recomendada es la v6-s1 y la v6 solo tenía las semillas 0 (Mac) y 1 (Actions, run 42948616971).
# Misma configuración y mismo procedimiento que semillas-v6.yml, sin tocar sus resultados:
#
#   entrenar   v6 (Mónaco, Bosque y Puerto) con la semilla 2
#   fase-a     Mónaco, Bosque, Puerto y Puerto r9.5 (nunca la Sierra, ya usada)  → metrics/semillas-v6-s2.json
#   extremos   las 21 pruebas de `rally seleccionar`                             → metrics/generalizacion-v6-s2.json
#   guardar    sube las métricas a la rama desde la que se lanzó
#
# Solo se lanza a mano: Actions → Semilla 2 de la v6 → Run workflow (o `gh workflow run semilla2-v6.yml --ref <rama>`).
name: Semilla 2 de la v6

on:
  workflow_dispatch:

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno del entrenamiento
        run: pip install -r requirements.txt && pip install -e .
      - name: Demostraciones (etapa datos, determinista)
        run: rally pipeline datos
      - name: Entrenar v6 con la semilla 2
        run: python scripts/analisis/entrenar_semilla.py --pistas monaco,bosque,puerto --semilla 2
      - name: Exportar a numpy (comparado con PyTorch)
        run: |
          python - <<'EOF'
          import json
          from rally.agentes.red_numpy import exportar
          d = "models/semillas-v6/v6-s2"
          r = exportar(f"{d}/modelo.zip", f"{d}/modelo.npz")
          json.dump(r, open(f"{d}/exportacion.json", "w"), indent=2)
          print(r)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: v6-s2
          path: |
            models/semillas-v6/v6-s2
            mlflow.db
            mlruns
          retention-days: 90

  fase-a:
    needs: entrenar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno
        run: pip install -r requirements.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: v6-s2
          path: artefactos/v6-s2
      - name: Fase A con la semilla 2 (sin la Sierra)
        run: |
          python scripts/analisis/sobreajuste_pistas.py \
            --modelo v6-pistas-s2=artefactos/v6-s2/models/semillas-v6/v6-s2/modelo.npz:monaco,bosque,puerto \
            --episodios 100 --salida metrics/semillas-v6-s2.json
      - uses: actions/upload-artifact@v4
        with:
          name: metricas-fase-a-s2
          path: metrics/semillas-v6-s2.json

  extremos:
    needs: entrenar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno
        run: pip install -r requirements.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: v6-s2
          path: artefactos/v6-s2
      - name: 21 pruebas de generalización (las de rally seleccionar)
        run: |
          python scripts/analisis/generalizacion_modelos.py \
            --modelo v6-s2=artefactos/v6-s2/models/semillas-v6/v6-s2/modelo.npz \
            --salida metrics/generalizacion-v6-s2.json
      - uses: actions/upload-artifact@v4
        with:
          name: metricas-extremos-s2
          path: metrics/generalizacion-v6-s2.json

  guardar:
    needs: [entrenar, fase-a, extremos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Subir métricas a la rama
        run: |
          mkdir -p metrics docs/experimentos/semillas-v6
          cp artefactos/metricas-fase-a-s2/semillas-v6-s2.json metrics/ 2>/dev/null || true
          cp artefactos/metricas-extremos-s2/generalizacion-v6-s2.json metrics/ 2>/dev/null || true
          cp artefactos/v6-s2/models/semillas-v6/v6-s2/info.json docs/experimentos/semillas-v6/v6-s2-info.json 2>/dev/null || true
          cp artefactos/v6-s2/models/semillas-v6/v6-s2/exportacion.json docs/experimentos/semillas-v6/v6-s2-exportacion.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics docs/experimentos/semillas-v6
          git diff --cached --quiet && { echo "Sin resultados nuevos"; exit 0; }
          git commit -m "Resultados de la semilla 2 de la v6 (run ${{ github.run_id }})"
          git push
