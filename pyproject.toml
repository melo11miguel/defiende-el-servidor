[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-rally"
version = "0.1.0"
description = "Ambiente Autonomous Rally para aprendizaje por refuerzo (Gymnasium)"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
