[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-rally"
version = "0.1.0"
description = "Ambiente Autonomous Rally para aprendizaje por refuerzo (Gymnasium)"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.26", "rich>=13", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["torch>=2.2", "stable-baselines3>=2.3", "mlflow>=3.0", "dvc>=3.50", "pyyaml>=6", "huggingface_hub>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rally = "rally.cli:main"

[tool.setuptools.package-data]
rally = ["static/*"]
